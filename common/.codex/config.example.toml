approvals_reviewer = "auto_review"

model_reasoning_effort = "xhigh"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
# sandbox_mode = "danger-full-access"
model = "gpt-5.5"

# Privacy: no machine analytics, no statsig metrics (otel.metrics_exporter
# defaults to "statsig" when unset)
analytics.enabled = false
otel.metrics_exporter = "none"

[windows]
sandbox = "elevated"

[shell_environment_policy]
inherit = "all"

[tui.model_availability_nux]
"gpt-5.5" = 4

[projects.'c:\brunolm\projects']
trust_level = "trusted"

[projects.'c:\brunolm\projects\dotfiles']
trust_level = "trusted"

[features]
fast_mode = true
